<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Academia Artes Marciais</title>
</head>
<body>
    <header>
        <h1>Academia Artes Marciais</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="serviços.html">Serviços</a>
            <a href="agendamento.html">Agendamento</a>
        </nav>
    </header>

    <main>
        <h2>Agende sua visita</h2>

        <form action="#" method="post">
            <label for="nome">Nome Completo:</label>
            <input type="text" name="nome" id="nome">
            <br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email">
            <br>
            <label for="telefone">Telefone:</label>
            <input
            type="tel"
            name="telefone"
            id="telefone"
            required
            inputmode="numeric"
            maxlength="15"
            pattern="(?:\(?[1-9]{2}\)?\s?)?(?:9\d{4}|\d{4})-?\d{4}"
            title="Digite com DDD. Ex: (17) 98765-4321 ou 17987654321"
            >
            <br>
            <label for="data">Data:</label>
            <input type="date" name="data" id="data">
            <br>
            <label for="hora">Horário:</label>
            <input type="time" name="hora" id="hora">
            <br>
            <label for="modalidade">Modalidade:</label>
            <select name="modalidade" id="modalidade">
                <option value="">Selecione uma opção</option>
                <option value="muay-thay">Muay Thay</option>
                <option value="boxe">Boxe</option>
                <option value="jiu-jitsu-brasileiro">Jiu Jitsu Brasileiro</option>
                <option value="judo">judô</option>
                <option value="kick-box">Kick Box</option>
            </select>
            <br>
            <label for="mensagem">Mensagem:</label>
            <textarea name="mensagem" id="mensagem" rows="4"></textarea>´
            <br>
            <button type="submit">Confirmar agendamento</button>
        </form>

    </main>

    <footer>
        <p>
           Academia Artes Marciais - Defesa pessoal é mais segurança. 
        </p>
    </footer>
</body>
</html>
